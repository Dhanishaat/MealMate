<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Home | MealMate</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #263238, #37474f);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.12);
            padding: 45px 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
            width: 380px;
        }

        h3 {
            margin-bottom: 35px;
            font-size: 26px;
            letter-spacing: 1px;
        }

        a {
            display: block;
            text-decoration: none;
            margin: 18px 0;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .add {
            background: #4caf50;
            color: white;
        }

        .add:hover {
            background: #43a047;
            transform: translateY(-2px);
        }

        .show {
            background: #2196f3;
            color: white;
        }

        .show:hover {
            background: #1e88e5;
            transform: translateY(-2px);
        }

        .subtitle {
            margin-top: 25px;
            font-size: 13px;
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="admin-card">
        <h3>Welcome, Admin 👨‍💼</h3>

        <a href="/open_add_restaurant" class="add">➕ Add New Restaurant</a>
        <a href="/open_show_restaurant" class="show">📋 Show Restaurants</a>

        <div class="subtitle">
            Manage restaurants efficiently
        </div>
    </div>

</body>
</html>
