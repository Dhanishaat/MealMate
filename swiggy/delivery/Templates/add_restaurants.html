<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Restaurant | MealMate</title>
    {% load static %}

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f79c6b, #ff6f3c);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 25px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 32px;
            color: #1995AD;
            font-weight: 700;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff5722;
            box-shadow: 0 0 0 2px rgba(255,87,34,0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            border: none;
            background: #ff5722;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }

        /* RESPONSIVE */
        @media(max-width: 480px) {
            .card {
                padding: 35px 25px;
            }

            h2 { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Add New Restaurant</h2>

        <form action="{% url 'add_restaurant' %}" method="POST">
            {% csrf_token %}

            <label>Restaurant Name</label>
            <input type="text" name="name" placeholder="Enter restaurant name" required>

            <label>Picture URL</label>
            <input type="text" name="picture" placeholder="Enter image URL" required>

            <label>Cuisine</label>
            <input type="text" name="cuisine" placeholder="Enter cuisine type" required>

            <label>Rating</label>
            <input type="number" name="rating" min="0" max="5" step="0.5" placeholder="0 - 5" required>

            <button type="submit">Add Restaurant</button>
        </form>
    </div>

</body>
</html>
