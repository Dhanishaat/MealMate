<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        h3 {
            text-align: center;
            margin-bottom: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .cart-link {
            background-color: #ff9800;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .cart-link:hover {
            background-color: #e68900;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th {
            background-color: #1995AD;
            color: white;
            padding: 14px;
        }

        td {
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background-color: #f1f9fb;
        }

        /* MENU IMAGE */
        .menu-img {
            width: 140px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .menu-img:hover {
            transform: scale(1.08);
        }

        /* Veg / Non-Veg */
        .veg {
            color: green;
            font-weight: bold;
        }

        .non-veg {
            color: red;
            font-weight: bold;
        }

        /* Add to cart button */
        .add-cart {
            background-color: #28a745;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .add-cart:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <h3>Welcome {{ username }} 👋</h3>
        <a href="{% url 'show_cart' username %}" class="cart-link">
            🛒 Go to Cart
        </a>
    </div>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Image</th>
                <th>Description</th>
                <th>Price (₹)</th>
                <th>Type</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for item in itemList %}
            <tr>
                <td><strong>{{ item.name }}</strong></td>

                <td>
                    <img src="{{ item.picture }}" class="menu-img">
                </td>

                <td>{{ item.description }}</td>
                <td>₹ {{ item.price }}</td>

                <td>
                    {% if item.vegeterian %}
                        <span class="veg">Veg</span>
                    {% else %}
                        <span class="non-veg">Non-Veg</span>
                    {% endif %}
                </td>

                <td>
                    <a href="{% url 'add_to_cart' item.id username %}" 
                       class="add-cart">
                        Add to Cart
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
