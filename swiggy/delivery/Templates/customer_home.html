<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        h3 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: hidden;
        }

        thead {
            background: #ff5722;
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: center;
        }

        th {
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        tbody tr {
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }

        tbody tr:hover {
            background: #fff3e0;
        }

        img {
            width: 120px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .rating {
            background: #4caf50;
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
        }

        a {
            text-decoration: none;
            background: #ff5722;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            transition: background 0.3s;
        }

        a:hover {
            background: #e64a19;
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead {
                display: none;
            }

            tbody tr {
                margin-bottom: 20px;
                border-radius: 12px;
                box-shadow: 0 6px 15px rgba(0,0,0,0.1);
                padding: 15px;
                background: white;
            }

            td {
                text-align: left;
                padding: 10px 0;
            }

            td::before {
                content: attr(data-label);
                font-weight: bold;
                display: block;
                color: #555;
                margin-bottom: 5px;
            }
        }
    </style>
</head>

<body>

<h3>Welcome {{ username }} 👋</h3>

<table>
    <thead>
        <tr>
            <th>Restaurant</th>
            <th>Picture</th>
            <th>Cuisine</th>
            <th>Rating</th>
            <th>Operations</th>
        </tr>
    </thead>

    <tbody>
        {% for r in restaurantList %}
        <tr>
            <td data-label="Restaurant">{{ r.name }}</td>
            <td data-label="Picture">
                <img src="{{ r.picture }}" alt="{{ r.name }}">
            </td>
            <td data-label="Cuisine">{{ r.cuisine }}</td>
            <td data-label="Rating">
                <span class="rating">{{ r.rating }} ⭐</span>
            </td>
            <td data-label="Operations">
                <a href="{% url 'view_menu' r.id username%}">View Menu</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

</body>
</html>
