<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | MealMate</title>
    {% load static %}

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f79c6b, #ff6f3c);
            color: white;
        }

        /* ====== CARD CONTAINER ====== */
        .container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            padding: 70px 50px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
            width: 450px;
            max-width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        a {
            display: block;
            width: 100%;
            padding: 16px 0;
            margin: 15px 0;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .signup {
            background: white;
            color: #ff5722;
        }

        .signup:hover {
            background: #ffe0d6;
            transform: translateY(-2px);
        }

        .signin {
            border: 2px solid white;
            color: white;
        }

        .signin:hover {
            background: white;
            color: #ff5722;
            transform: translateY(-2px);
        }

        .tagline {
            font-size: 16px;
            opacity: 0.95;
            margin-top: 35px;
        }

        /* RESPONSIVE */
        @media(max-width: 480px) {
            .container {
                padding: 50px 30px;
            }

            h1 {
                font-size: 32px;
            }

            a {
                font-size: 16px;
                padding: 14px 0;
            }

            .tagline {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to MealMate 🍽️</h1>

        <a href="open_signup" class="signup">SIGN UP</a>
        <a href="open_signin" class="signin">SIGN IN</a>

        <div class="tagline">
            Discover • Order • Enjoy
        </div>
    </div>

</body>
</html>
