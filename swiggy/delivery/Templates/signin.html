<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | MealMate</title>
    {% load static %}

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            display: flex;
            width: 900px;
            max-width: 95%;
            height: 550px;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            background: white;
        }

        /* ===== LEFT IMAGE ===== */
        .image-section {
            flex: 1;
        }

        .image-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== RIGHT FORM ===== */
        .form-section {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            font-size: 32px;
            font-weight: 700;
            color: black;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff5722;
            box-shadow: 0 0 0 2px rgba(255,87,34,0.15);
        }

        .signin-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #ff5722;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .signin-btn:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }

        .footer-text {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
            color: #555;
        }

        .footer-text a {
            color: #ff5722;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width: 850px) {
            .login-container {
                flex-direction: column;
                height: auto;
            }
            .image-section {
                height: 200px;
            }
            .form-section {
                padding: 30px 25px;
            }
            .form-section h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <!-- IMAGE SECTION -->
        <div class="image-section">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?q=80&w=2070&auto=format&fit=crop" alt="Delicious Food">
        </div>

        <!-- FORM SECTION -->
        <div class="form-section">
            <h2>SIGN IN</h2>
            <form method="post" action="{% url 'signin' %}">
                {% csrf_token %}

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="signin-btn">Sign In</button>
            </form>

            <div class="footer-text">
                New to MealMate? <a href="open_signup">Create an account</a>
            </div>
        </div>

    </div>

</body>
</html>
