<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | MealMate</title>
    {% load static %}

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff7043, #ff5722);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        h3 {
            margin-bottom: 25px;
            color: #333;
            letter-spacing: 1px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ff5722;
            box-shadow: 0 0 0 2px rgba(255,87,34,0.2);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border-radius: 30px;
            border: none;
            background: #ff5722;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        .footer-text a {
            color: #ff5722;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <h3>SIGN IN</h3>

        <form method="post" action="{% url 'signin' %}">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required>

            <br><br>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">SIGN IN</button>
        </form>

        <div class="footer-text">
            New to MealMate?
            <a href="open_signup">Create an account</a>
        </div>
    </div>

</body>
</html>
