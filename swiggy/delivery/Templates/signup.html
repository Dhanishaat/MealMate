<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | MealMate</title>
    {% load static %}

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f79c6b, #ff6f3c);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .signup-container {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 50px 40px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            font-size: 32px;
            color: #1995AD;
            margin-bottom: 30px;
            font-weight: 700;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            resize: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #ff5722;
            box-shadow: 0 0 0 2px rgba(255,87,34,0.2);
        }

        textarea { height: 70px; }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 25px;
            border: none;
            background: #ff5722;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e64a19;
            transform: translateY(-2px);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .footer-text a {
            color: #ff5722;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media(max-width: 480px) {
            .signup-container {
                padding: 35px 25px;
            }
            h2 { font-size: 28px; }
        }
    </style>
</head>

<body>

    <div class="signup-container">
        <h2>Create Account</h2>

        <form action="{% url 'signup' %}" method="post">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" placeholder="Enter your username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required>

            <label>Mobile</label>
            <input type="text" name="mobile" placeholder="Enter your mobile number" required>

            <label>Address</label>
            <textarea name="address" placeholder="Enter your address" required></textarea>

            <button type="submit">CREATE ACCOUNT</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="open_signin">Sign in</a>
        </div>
    </div>

</body>
</html>
